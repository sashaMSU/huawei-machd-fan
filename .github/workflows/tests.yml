name: Offline tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate configuration (no hardware)
        run: python huawei_fan_table.py check
      - name: Unit and signal tests (no root or hardware)
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh uninstall.sh
